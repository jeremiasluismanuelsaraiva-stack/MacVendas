<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
        <span>Tema</span>
    </button>

    <div class="container">
        <!-- Login -->
        <div id="loginForm" class="auth-card">
            <div class="auth-header">
                <i class="fas fa-shield-alt"></i>
                <h2>Login</h2>
                <p>Acesse sua conta</p>
            </div>
            <div id="loginMessage" class="message"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="••••••">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
            <div class="auth-footer">
                Não tem conta? <span onclick="showRegister()">Criar conta</span>
            </div>
        </div>

        <!-- Registro -->
        <div id="registerForm" class="auth-card" style="display: none;">
            <div class="auth-header">
                <i class="fas fa-user-plus"></i>
                <h2>Criar Conta</h2>
                <p>Cadastre-se para começar</p>
            </div>
            <div id="registerMessage" class="message"></div>
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="registerName" placeholder="João Silva">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="joao@exemplo.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="registerPassword" placeholder="mínimo 6 caracteres">
            </div>
            <button class="btn btn-primary" onclick="handleRegister()">Criar Conta</button>
            <div class="auth-footer">
                Já tem conta? <span onclick="showLogin()">Fazer login</span>
            </div>
        </div>

        <!-- Verificação -->
        <div id="verifyForm" class="auth-card" style="display: none;">
            <div class="auth-header">
                <i class="fas fa-envelope"></i>
                <h2>Verifique seu Email</h2>
                <p>Enviamos um link de verificação</p>
            </div>
            <div id="verifyMessage" class="message"></div>
            <button class="btn btn-primary" onclick="resendVerificationEmail()">Reenviar Email</button>
            <div class="auth-footer">
                <span onclick="showLogin()">Voltar ao login</span>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { registerUser, loginUser, resendVerification, onAuthState } from './firebase.js';
        
        window.toggleTheme = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        };
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
        
        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `message ${type}`;
        }
        
        window.showLogin = () => {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('verifyForm').style.display = 'none';
        };
        
        window.showRegister = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('verifyForm').style.display = 'none';
        };
        
        window.showVerify = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('verifyForm').style.display = 'block';
        };
        
        window.handleLogin = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('loginMessage', 'Preencha todos os campos', 'error');
                return;
            }
            
            const result = await loginUser(email, password);
            
            if (result.success) {
                localStorage.setItem('userData', JSON.stringify(result.user));
                window.location.href = 'dashboard.html';
            } else {
                showMessage('loginMessage', result.message, 'error');
            }
        };
        
        window.handleRegister = async () => {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            if (!name || !email || !password) {
                showMessage('registerMessage', 'Preencha todos os campos', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('registerMessage', 'Senha deve ter 6+ caracteres', 'error');
                return;
            }
            
            const result = await registerUser(name, email, password);
            
            if (result.success) {
                showMessage('registerMessage', result.message, 'success');
                setTimeout(() => window.showVerify(), 3000);
            } else {
                showMessage('registerMessage', result.message, 'error');
            }
        };
        
        window.resendVerificationEmail = async () => {
            const result = await resendVerification();
            showMessage('verifyMessage', result.message, result.success ? 'success' : 'error');
        };
        
        // Verificar se já está logado
        onAuthState((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
        
        document.getElementById('loginPassword')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') window.handleLogin();
        });
    </script>
</body>
</html>
