<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Sistema de Gestão</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <button
        class="theme-toggle"
        onclick="toggleTheme()"
    >
        <i class="fas fa-moon"></i>
        <span>Tema</span>
    </button>


    <div class="container">


        <!-- =========================
             LOGIN
        ========================== -->

        <div
            id="loginForm"
            class="auth-card"
        >

            <div class="auth-header">

                <i class="fas fa-shield-alt"></i>

                <h2>Login</h2>

                <p>Acesse sua conta</p>

            </div>


            <div
                id="loginMessage"
                class="message"
            ></div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="seu@email.com"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label>Senha</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="••••••"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="btn btn-primary"
                id="loginButton"
                onclick="handleLogin()"
            >
                Entrar
            </button>


            <div class="auth-footer">

                <span onclick="showForgotPassword()">
                    Esqueci da palavra-passe
                </span>

            </div>


            <div class="auth-footer">

                Não tem conta?

                <span onclick="showRegister()">
                    Criar conta
                </span>

            </div>

        </div>



        <!-- =========================
             REGISTRO
        ========================== -->

        <div
            id="registerForm"
            class="auth-card"
            style="display: none;"
        >

            <div class="auth-header">

                <i class="fas fa-user-plus"></i>

                <h2>Criar Conta</h2>

                <p>Cadastre-se para começar</p>

            </div>


            <div
                id="registerMessage"
                class="message"
            ></div>


            <div class="form-group">

                <label>Nome Completo</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Seu nome"
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="seu@email.com"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label>Senha</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="mínimo 6 caracteres"
                    autocomplete="new-password"
                >

            </div>


            <button
                class="btn btn-primary"
                id="registerButton"
                onclick="handleRegister()"
            >
                Criar Conta
            </button>


            <div class="auth-footer">

                Já tem conta?

                <span onclick="showLogin()">
                    Fazer login
                </span>

            </div>

        </div>



        <!-- =========================
             RECUPERAR PALAVRA-PASSE
        ========================== -->

        <div
            id="forgotPasswordForm"
            class="auth-card"
            style="display: none;"
        >

            <div class="auth-header">

                <i class="fas fa-key"></i>

                <h2>Recuperar palavra-passe</h2>

                <p>
                    Digite seu email para receber o link
                </p>

            </div>


            <div
                id="forgotMessage"
                class="message"
            ></div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="seu@email.com"
                    autocomplete="email"
                >

            </div>


            <button
                class="btn btn-primary"
                id="forgotButton"
                onclick="handleForgotPassword()"
            >
                Enviar link
            </button>


            <div class="auth-footer">

                <span onclick="showLogin()">
                    Voltar ao login
                </span>

            </div>

        </div>



        <!-- =========================
             VERIFICAÇÃO
        ========================== -->

        <div
            id="verifyForm"
            class="auth-card"
            style="display: none;"
        >

            <div class="auth-header">

                <i class="fas fa-envelope"></i>

                <h2>Verifique seu Email</h2>

                <p>
                    Enviamos um link de verificação
                </p>

            </div>


            <div
                id="verifyMessage"
                class="message"
            ></div>


            <button
                class="btn btn-primary"
                onclick="resendVerificationEmail()"
            >
                Reenviar Email
            </button>


            <div class="auth-footer">

                <span onclick="showLogin()">
                    Voltar ao login
                </span>

            </div>

        </div>

    </div>



    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">

        import {

            registerUser,

            loginUser,

            recuperarSenha,

            resendVerification

        } from './firebase.js';



        // =================================================
        // TEMA
        // =================================================

        window.toggleTheme = () => {

            const current =
                document.documentElement
                    .getAttribute('data-theme');


            const newTheme =
                current === 'dark'
                    ? 'light'
                    : 'dark';


            document.documentElement
                .setAttribute(
                    'data-theme',
                    newTheme
                );


            localStorage.setItem(
                'theme',
                newTheme
            );

        };


        const savedTheme =
            localStorage.getItem('theme');


        if (savedTheme) {

            document.documentElement
                .setAttribute(
                    'data-theme',
                    savedTheme
                );

        }



        // =================================================
        // MENSAGENS
        // =================================================

        function showMessage(
            elementId,
            text,
            type
        ) {

            const el =
                document.getElementById(
                    elementId
                );


            if (!el) return;


            el.textContent = text;


            el.className =
                `message ${type}`;

        }



        // =================================================
        // ESCONDER TODAS AS TELAS
        // =================================================

        function hideAllForms() {

            document.getElementById(
                'loginForm'
            ).style.display = 'none';


            document.getElementById(
                'registerForm'
            ).style.display = 'none';


            document.getElementById(
                'forgotPasswordForm'
            ).style.display = 'none';


            document.getElementById(
                'verifyForm'
            ).style.display = 'none';

        }



        // =================================================
        // LOGIN
        // =================================================

        window.showLogin = () => {

            hideAllForms();


            document.getElementById(
                'loginForm'
            ).style.display = 'block';

        };



        // =================================================
        // REGISTRO
        // =================================================

        window.showRegister = () => {

            hideAllForms();


            document.getElementById(
                'registerForm'
            ).style.display = 'block';

        };



        // =================================================
        // RECUPERAR PALAVRA-PASSE
        // =================================================

        window.showForgotPassword = () => {

            hideAllForms();


            document.getElementById(
                'forgotPasswordForm'
            ).style.display = 'block';


            document.getElementById(
                'forgotMessage'
            ).className = 'message';


            document.getElementById(
                'forgotMessage'
            ).textContent = '';

        };



        window.handleForgotPassword = async () => {

            const email =
                document.getElementById(
                    'forgotEmail'
                ).value.trim();


            if (!email) {

                showMessage(
                    'forgotMessage',
                    'Digite seu email.',
                    'error'
                );

                return;

            }


            const button =
                document.getElementById(
                    'forgotButton'
                );


            button.disabled = true;

            button.textContent =
                'Enviando...';


            try {

                const result =
                    await recuperarSenha(email);


                showMessage(
                    'forgotMessage',
                    result.message,
                    result.success
                        ? 'success'
                        : 'error'
                );

            } catch (error) {

                console.error(error);


                showMessage(
                    'forgotMessage',
                    error.message ||
                    'Não foi possível enviar o link.',
                    'error'
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    'Enviar link';

            }

        };



        // =================================================
        // VERIFICAÇÃO
        // =================================================

        window.showVerify = () => {

            hideAllForms();


            document.getElementById(
                'verifyForm'
            ).style.display = 'block';

        };



        // =================================================
        // LOGIN
        // =================================================

        window.handleLogin = async () => {

            const email =
                document.getElementById(
                    'loginEmail'
                ).value.trim();


            const password =
                document.getElementById(
                    'loginPassword'
                ).value;


            if (!email || !password) {

                showMessage(
                    'loginMessage',
                    'Preencha todos os campos.',
                    'error'
                );

                return;

            }


            const button =
                document.getElementById(
                    'loginButton'
                );


            button.disabled = true;

            button.textContent =
                'Entrando...';


            try {

                const result =
                    await loginUser(
                        email,
                        password
                    );


                if (result.success) {

                    localStorage.setItem(
                        'userData',
                        JSON.stringify(
                            result.user
                        )
                    );


                    // Só aqui redireciona
                    window.location.href =
                        '/dashboard.html';

                } else {

                    showMessage(
                        'loginMessage',
                        result.message,
                        'error'
                    );

                }

            } catch (error) {

                console.error(error);


                showMessage(
                    'loginMessage',
                    error.message ||
                    'Erro ao fazer login.',
                    'error'
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    'Entrar';

            }

        };



        // =================================================
        // REGISTRO
        // =================================================

        window.handleRegister = async () => {

            const name =
                document.getElementById(
                    'registerName'
                ).value.trim();


            const email =
                document.getElementById(
                    'registerEmail'
                ).value.trim();


            const password =
                document.getElementById(
                    'registerPassword'
                ).value;


            if (
                !name ||
                !email ||
                !password
            ) {

                showMessage(
                    'registerMessage',
                    'Preencha todos os campos.',
                    'error'
                );

                return;

            }


            if (password.length < 6) {

                showMessage(
                    'registerMessage',
                    'A senha deve ter pelo menos 6 caracteres.',
                    'error'
                );

                return;

            }


            const button =
                document.getElementById(
                    'registerButton'
                );


            button.disabled = true;

            button.textContent =
                'Criando...';


            try {

                const result =
                    await registerUser(
                        name,
                        email,
                        password
                    );


                if (result.success) {

                    showMessage(
                        'registerMessage',
                        result.message,
                        'success'
                    );


                    setTimeout(
                        () => {

                            window.showVerify();

                        },
                        3000
                    );

                } else {

                    showMessage(
                        'registerMessage',
                        result.message,
                        'error'
                    );

                }

            } catch (error) {

                console.error(error);


                showMessage(
                    'registerMessage',
                    error.message ||
                    'Erro ao criar conta.',
                    'error'
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    'Criar Conta';

            }

        };



        // =================================================
        // REENVIAR VERIFICAÇÃO
        // =================================================

        window.resendVerificationEmail =
            async () => {

                try {

                    const result =
                        await resendVerification();


                    showMessage(
                        'verifyMessage',
                        result.message,
                        result.success
                            ? 'success'
                            : 'error'
                    );

                } catch (error) {

                    console.error(error);


                    showMessage(
                        'verifyMessage',
                        error.message ||
                        'Erro ao reenviar email.',
                        'error'
                    );

                }

            };



        // =================================================
        // ENTER NO LOGIN
        // =================================================

        document
            .getElementById(
                'loginPassword'
            )
            ?.addEventListener(
                'keypress',
                (e) => {

                    if (e.key === 'Enter') {

                        window.handleLogin();

                    }

                }
            );



        // =================================================
        // ENTER NA RECUPERAÇÃO
        // =================================================

        document
            .getElementById(
                'forgotEmail'
            )
            ?.addEventListener(
                'keypress',
                (e) => {

                    if (e.key === 'Enter') {

                        window.handleForgotPassword();

                    }

                }
            );



        // =================================================
        // ENTER NO REGISTRO
        // =================================================

        document
            .getElementById(
                'registerPassword'
            )
            ?.addEventListener(
                'keypress',
                (e) => {

                    if (e.key === 'Enter') {

                        window.handleRegister();

                    }

                }
            );

    </script>

</body>
</html>
