<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Sistema de Gestão</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         TEMA
    ====================================================== -->

    <button
        class="theme-toggle"
        type="button"
        id="themeToggle"
    >

        <i class="fas fa-moon"></i>

        <span>Tema</span>

    </button>


    <div class="container">


        <!-- =================================================
             LOGIN
        ================================================== -->

        <div
            id="loginForm"
            class="auth-card"
        >

            <div class="auth-header">

                <i class="fas fa-shield-alt"></i>

                <h2>Login</h2>

                <p>Acesse sua conta</p>

            </div>


            <div
                id="loginMessage"
                class="message"
            ></div>


            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="seu@email.com"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Senha
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="••••••"
                    autocomplete="current-password"
                >

            </div>


            <button
                type="button"
                class="btn btn-primary"
                id="loginButton"
            >
                Entrar
            </button>


            <div class="auth-footer">

                <span id="forgotLink">
                    Esqueci da palavra-passe
                </span>

            </div>


            <div class="auth-footer">

                Não tem conta?

                <span id="registerLink">
                    Criar conta
                </span>

            </div>

        </div>


        <!-- =================================================
             REGISTRO
        ================================================== -->

        <div
            id="registerForm"
            class="auth-card"
            style="display:none;"
        >

            <div class="auth-header">

                <i class="fas fa-user-plus"></i>

                <h2>Criar Conta</h2>

                <p>Cadastre-se para começar</p>

            </div>


            <div
                id="registerMessage"
                class="message"
            ></div>


            <div class="form-group">

                <label for="registerName">
                    Nome Completo
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Seu nome"
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="seu@email.com"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Senha
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="mínimo 6 caracteres"
                    autocomplete="new-password"
                >

            </div>


            <button
                type="button"
                class="btn btn-primary"
                id="registerButton"
            >
                Criar Conta
            </button>


            <div class="auth-footer">

                Já tem conta?

                <span id="loginLink">
                    Fazer login
                </span>

            </div>

        </div>


        <!-- =================================================
             RECUPERAR SENHA
        ================================================== -->

        <div
            id="forgotPasswordForm"
            class="auth-card"
            style="display:none;"
        >

            <div class="auth-header">

                <i class="fas fa-key"></i>

                <h2>Recuperar palavra-passe</h2>

                <p>
                    Digite seu email para receber o link
                </p>

            </div>


            <div
                id="forgotMessage"
                class="message"
            ></div>


            <div class="form-group">

                <label for="forgotEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="seu@email.com"
                    autocomplete="email"
                >

            </div>


            <button
                type="button"
                class="btn btn-primary"
                id="forgotButton"
            >
                Enviar link
            </button>


            <div class="auth-footer">

                <span id="forgotBackLink">
                    Voltar ao login
                </span>

            </div>

        </div>


        <!-- =================================================
             VERIFICAÇÃO
        ================================================== -->

        <div
            id="verifyForm"
            class="auth-card"
            style="display:none;"
        >

            <div class="auth-header">

                <i class="fas fa-envelope"></i>

                <h2>Verifique seu Email</h2>

                <p>
                    Enviamos um link de verificação
                </p>

            </div>


            <div
                id="verifyMessage"
                class="message"
            ></div>


            <button
                type="button"
                class="btn btn-primary"
                id="resendButton"
            >
                Reenviar Email
            </button>


            <div class="auth-footer">

                <span id="verifyBackLink">
                    Voltar ao login
                </span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FIREBASE
    ====================================================== -->

    <script type="module">

        import {

            registerUser,
            loginUser,
            recuperarSenha,
            resendVerification

        } from "./firebase.js";


        // =================================================
        // ELEMENTOS
        // =================================================

        const loginForm =
            document.getElementById("loginForm");

        const registerForm =
            document.getElementById("registerForm");

        const forgotPasswordForm =
            document.getElementById("forgotPasswordForm");

        const verifyForm =
            document.getElementById("verifyForm");


        const loginButton =
            document.getElementById("loginButton");

        const registerButton =
            document.getElementById("registerButton");

        const forgotButton =
            document.getElementById("forgotButton");

        const resendButton =
            document.getElementById("resendButton");


        // =================================================
        // TEMA
        // =================================================

        const themeToggle =
            document.getElementById("themeToggle");


        function aplicarTema() {

            const tema =
                localStorage.getItem("theme") ||
                "light";

            document.documentElement
                .setAttribute(
                    "data-theme",
                    tema
                );

        }


        themeToggle.addEventListener(
            "click",
            () => {

                const atual =
                    document.documentElement
                        .getAttribute("data-theme");

                const novo =
                    atual === "dark"
                        ? "light"
                        : "dark";

                document.documentElement
                    .setAttribute(
                        "data-theme",
                        novo
                    );

                localStorage.setItem(
                    "theme",
                    novo
                );

            }
        );


        aplicarTema();


        // =================================================
        // MENSAGEM
        // =================================================

        function showMessage(
            elementId,
            text,
            type
        ) {

            const elemento =
                document.getElementById(
                    elementId
                );

            if (!elemento) {
                return;
            }


            elemento.textContent =
                text || "";


            elemento.className =
                "message " +
                (type || "");

        }


        // =================================================
        // ESCONDER TODAS
        // =================================================

        function hideAllForms() {

            loginForm.style.display =
                "none";

            registerForm.style.display =
                "none";

            forgotPasswordForm.style.display =
                "none";

            verifyForm.style.display =
                "none";

        }


        // =================================================
        // LOGIN
        // =================================================

        function showLogin() {

            hideAllForms();

            loginForm.style.display =
                "block";

        }


        // =================================================
        // REGISTRO
        // =================================================

        function showRegister() {

            hideAllForms();

            registerForm.style.display =
                "block";

            showMessage(
                "registerMessage",
                "",
                ""
            );

        }


        // =================================================
        // RECUPERAR
        // =================================================

        function showForgotPassword() {

            hideAllForms();

            forgotPasswordForm.style.display =
                "block";

            showMessage(
                "forgotMessage",
                "",
                ""
            );

        }


        // =================================================
        // VERIFICAÇÃO
        // =================================================

        function showVerify() {

            hideAllForms();

            verifyForm.style.display =
                "block";

        }


        // =================================================
        // LINKS
        // =================================================

        document
            .getElementById("registerLink")
            .addEventListener(
                "click",
                showRegister
            );


        document
            .getElementById("loginLink")
            .addEventListener(
                "click",
                showLogin
            );


        document
            .getElementById("forgotLink")
            .addEventListener(
                "click",
                showForgotPassword
            );


        document
            .getElementById("forgotBackLink")
            .addEventListener(
                "click",
                showLogin
            );


        document
            .getElementById("verifyBackLink")
            .addEventListener(
                "click",
                showLogin
            );


        // =================================================
        // LOGIN
        // =================================================

        async function handleLogin() {

            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            if (!email || !password) {

                showMessage(
                    "loginMessage",
                    "Preencha todos os campos.",
                    "error"
                );

                return;

            }


            loginButton.disabled =
                true;

            loginButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Entrando...';


            try {

                console.log(
                    "[LOGIN] Iniciando login..."
                );


                const result =
                    await loginUser(
                        email,
                        password
                    );


                console.log(
                    "[LOGIN] Resultado:",
                    result
                );


                if (
                    result &&
                    result.success
                ) {

                    if (
                        result.user
                    ) {

                        localStorage.setItem(
                            "userData",
                            JSON.stringify(
                                result.user
                            )
                        );

                    }


                    showMessage(
                        "loginMessage",
                        "Login realizado com sucesso.",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "/dashboard.html";

                        },
                        300
                    );


                    return;

                }


                showMessage(
                    "loginMessage",
                    result?.message ||
                    "Não foi possível fazer login.",
                    "error"
                );

            }
            catch (error) {

                console.error(
                    "[LOGIN] Erro:",
                    error
                );


                showMessage(
                    "loginMessage",
                    error?.message ||
                    "Erro ao fazer login.",
                    "error"
                );

            }
            finally {

                loginButton.disabled =
                    false;

                loginButton.innerHTML =
                    "Entrar";

            }

        }


        // =================================================
        // REGISTRO
        // =================================================

        async function handleRegister() {

            const name =
                document
                    .getElementById("registerName")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("registerEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("registerPassword")
                    .value;


            if (
                !name ||
                !email ||
                !password
            ) {

                showMessage(
                    "registerMessage",
                    "Preencha todos os campos.",
                    "error"
                );

                return;

            }


            if (
                password.length < 6
            ) {

                showMessage(
                    "registerMessage",
                    "A senha deve ter pelo menos 6 caracteres.",
                    "error"
                );

                return;

            }


            registerButton.disabled =
                true;

            registerButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Criando...';


            try {

                console.log(
                    "[REGISTRO] Criando conta..."
                );


                const result =
                    await registerUser(
                        name,
                        email,
                        password
                    );


                console.log(
                    "[REGISTRO] Resultado:",
                    result
                );


                if (
                    result &&
                    result.success
                ) {

                    showMessage(
                        "registerMessage",
                        result.message ||
                        "Conta criada com sucesso!",
                        "success"
                    );


                    if (
                        result.user
                    ) {

                        localStorage.setItem(
                            "userData",
                            JSON.stringify(
                                result.user
                            )
                        );

                    }


                    setTimeout(
                        () => {

                            showVerify();

                        },
                        1000
                    );


                    return;

                }


                showMessage(
                    "registerMessage",
                    result?.message ||
                    "Não foi possível criar a conta.",
                    "error"
                );

            }
            catch (error) {

                console.error(
                    "[REGISTRO] Erro:",
                    error
                );


                showMessage(
                    "registerMessage",
                    error?.message ||
                    "Erro ao criar conta.",
                    "error"
                );

            }
            finally {

                registerButton.disabled =
                    false;

                registerButton.innerHTML =
                    "Criar Conta";

            }

        }


        // =================================================
        // RECUPERAR SENHA
        // =================================================

        async function handleForgotPassword() {

            const email =
                document
                    .getElementById("forgotEmail")
                    .value
                    .trim();


            if (!email) {

                showMessage(
                    "forgotMessage",
                    "Digite seu email.",
                    "error"
                );

                return;

            }


            forgotButton.disabled =
                true;

            forgotButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Enviando...';


            try {

                const result =
                    await recuperarSenha(
                        email
                    );


                showMessage(
                    "forgotMessage",
                    result?.message ||
                    "Operação concluída.",
                    result?.success
                        ? "success"
                        : "error"
                );

            }
            catch (error) {

                console.error(
                    "[RECUPERAÇÃO]",
                    error
                );


                showMessage(
                    "forgotMessage",
                    error?.message ||
                    "Não foi possível enviar o link.",
                    "error"
                );

            }
            finally {

                forgotButton.disabled =
                    false;

                forgotButton.innerHTML =
                    "Enviar link";

            }

        }


        // =================================================
        // REENVIAR VERIFICAÇÃO
        // =================================================

        async function resendVerificationEmail() {

            resendButton.disabled =
                true;

            resendButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Enviando...';


            try {

                const result =
                    await resendVerification();


                showMessage(
                    "verifyMessage",
                    result?.message ||
                    "Operação concluída.",
                    result?.success
                        ? "success"
                        : "error"
                );

            }
            catch (error) {

                console.error(
                    "[VERIFICAÇÃO]",
                    error
                );


                showMessage(
                    "verifyMessage",
                    error?.message ||
                    "Erro ao reenviar email.",
                    "error"
                );

            }
            finally {

                resendButton.disabled =
                    false;

                resendButton.innerHTML =
                    "Reenviar Email";

            }

        }


        // =================================================
        // EVENTOS
        // =================================================

        loginButton.addEventListener(
            "click",
            handleLogin
        );


        registerButton.addEventListener(
            "click",
            handleRegister
        );


        forgotButton.addEventListener(
            "click",
            handleForgotPassword
        );


        resendButton.addEventListener(
            "click",
            resendVerificationEmail
        );


        // =================================================
        // ENTER - LOGIN
        // =================================================

        document
            .getElementById("loginPassword")
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        handleLogin();

                    }

                }
            );


        // =================================================
        // ENTER - REGISTRO
        // =================================================

        document
            .getElementById("registerPassword")
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        handleRegister();

                    }

                }
            );


        // =================================================
        // ENTER - RECUPERAÇÃO
        // =================================================

        document
            .getElementById("forgotEmail")
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        handleForgotPassword();

                    }

                }
            );


        console.log(
            "[AUTH] Página de autenticação carregada."
        );

    </script>

</body>

</html>
